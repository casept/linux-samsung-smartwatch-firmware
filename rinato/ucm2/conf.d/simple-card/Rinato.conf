# Samsung Gear 2 (rinato): Yamaha YMU831 CODEC with one speaker and one
# microphone on the SoC's I2S, plus the Bluetooth controller's PCM
# interface on the CODEC's ext port for call audio.
Syntax 6

SectionUseCase."HiFi" {
	File "/Samsung/rinato/HiFi.conf"
	Comment "Speaker and microphone"
}

SectionUseCase."Voice Call" {
	File "/Samsung/rinato/VoiceCall.conf"
	Comment "Call audio over Bluetooth"
}

# Nothing routed and the speaker muted until a verb is enabled
BootSequence [
	cset "name='Speaker Playback Switch' off,off"
	cset "name='SP L Mixer DAC1L Switch' off"
	cset "name='SP R Mixer DAC1R Switch' off"
	cset "name='DAC1 L Mixer Music RX Switch' off"
	cset "name='DAC1 R Mixer Music RX Switch' off"
	cset "name='DAC1 L Mixer Ext RX Switch' off"
	cset "name='DAC1 R Mixer Ext RX Switch' off"
	cset "name='Ext TX L Mixer ADIF1 Switch' off"
	cset "name='Ext TX R Mixer ADIF1 Switch' off"
	cset "name='Music TX L Mixer ADIF1 Switch' off"
	cset "name='Music TX R Mixer ADIF1 Switch' off"
]
