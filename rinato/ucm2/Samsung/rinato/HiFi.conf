# Playback through the speaker and capture from the microphone, both on
# the SoC's I2S (the CODEC's music port).

SectionVerb {
	EnableSequence [
		# DAC and ADC stage parameters
		cset "name='Clear Dsp Parameter' 1"
		cset-tlv "name='DSP Output Parameters' ${ConfTopDir}/Samsung/rinato/dsp/aec_ae0_through.tlv"
		cset-tlv "name='DSP Output Parameters' ${ConfTopDir}/Samsung/rinato/dsp/aec_sp_dac1.tlv"
		cset-tlv "name='DSP Input Parameters' ${ConfTopDir}/Samsung/rinato/dsp/aec_ae1_through.tlv"
		cset-tlv "name='DSP Input Parameters' ${ConfTopDir}/Samsung/rinato/dsp/aec_adc.tlv"

		cset "name='Music Input Volume' 96,96"
		cset "name='Music Input Switch' on,on"
		cset "name='Music Output Volume' 96,96"
		cset "name='Music Output Switch' on,on"
	]
	DisableSequence [
		cset "name='Clear Dsp Parameter' 1"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Dac1 Output Volume' 96,96"
		cset "name='Dac1 Output Switch' on,on"
		# one speaker: mix both channels
		cset "name='Dac1 Swap' MonoMix"
		cset "name='DAC1 L Mixer Music RX Switch' on"
		cset "name='DAC1 R Mixer Music RX Switch' on"
		cset "name='SP L Mixer DAC1L Switch' on"
		cset "name='SP R Mixer DAC1R Switch' on"
		cset "name='Speaker Playback Switch' on,on"
	]
	DisableSequence [
		cset "name='Speaker Playback Switch' off,off"
		cset "name='SP L Mixer DAC1L Switch' off"
		cset "name='SP R Mixer DAC1R Switch' off"
		cset "name='DAC1 L Mixer Music RX Switch' off"
		cset "name='DAC1 R Mixer Music RX Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "hw:${CardId}"
		PlaybackMixerElem "Speaker"
		PlaybackVolume "Speaker Playback Volume"
		PlaybackSwitch "Speaker Playback Switch"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='Mic2 Capture Switch' on"
		cset "name='ADC0 L Mixer MIC2 Switch' on"
		cset "name='ADC0 R Mixer MIC2 Switch' on"
		cset "name='ADIF1 L Mux' ADC0L"
		cset "name='ADIF1 R Mux' ADC0R"
		cset "name='Adif1 Input Volume' 104,104"
		cset "name='Adif1 Input Switch' on,on"
		cset "name='Music TX L Mixer ADIF1 Switch' on"
		cset "name='Music TX R Mixer ADIF1 Switch' on"
	]
	DisableSequence [
		cset "name='Music TX L Mixer ADIF1 Switch' off"
		cset "name='Music TX R Mixer ADIF1 Switch' off"
		cset "name='ADC0 L Mixer MIC2 Switch' off"
		cset "name='ADC0 R Mixer MIC2 Switch' off"
		cset "name='Mic2 Capture Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixer "hw:${CardId}"
		CaptureMixerElem "Mic2"
		CaptureVolume "Mic2 Capture Volume"
		CaptureSwitch "Mic2 Capture Switch"
	}
}
