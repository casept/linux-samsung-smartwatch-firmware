# Call audio between the Bluetooth controller and the speaker and
# microphone. The controller's PCM interface is linked to the CODEC's ext
# port in the device tree, so the routes alone start the audio; no PCM
# device is opened. Narrowband (8 kHz) SCO.

SectionVerb {
	EnableSequence [
		cset "name='Ext Input Volume' 96,96"
		cset "name='Ext Input Switch' on,on"
		cset "name='Ext Output Volume' 102,102"
		cset "name='Ext Output Switch' on,on"
		# mono call audio: use the first channel on both sides
		cset "name='Ext In Swap' Both0"
		cset "name='Ext Out Swap' Both0"
	]
	DisableSequence [
		cset "name='Ext Input Switch' off,off"
		cset "name='Ext Output Switch' off,off"
	]
	Value {
		TQ "Voice"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Dac1 Output Volume' 102,102"
		cset "name='Dac1 Output Switch' on,on"
		cset "name='Dac1 Swap' MonoMix"
		cset "name='DAC1 L Mixer Ext RX Switch' on"
		cset "name='DAC1 R Mixer Ext RX Switch' on"
		cset "name='SP L Mixer DAC1L Switch' on"
		cset "name='SP R Mixer DAC1R Switch' on"
		cset "name='Speaker Playback Switch' on,on"
	]
	DisableSequence [
		cset "name='Speaker Playback Switch' off,off"
		cset "name='SP L Mixer DAC1L Switch' off"
		cset "name='SP R Mixer DAC1R Switch' off"
		cset "name='DAC1 L Mixer Ext RX Switch' off"
		cset "name='DAC1 R Mixer Ext RX Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackMixer "hw:${CardId}"
		PlaybackMixerElem "Speaker"
		PlaybackVolume "Speaker Playback Volume"
		PlaybackSwitch "Speaker Playback Switch"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='Mic2 Capture Switch' on"
		cset "name='ADC0 L Mixer MIC2 Switch' on"
		cset "name='ADC0 R Mixer MIC2 Switch' on"
		cset "name='ADIF1 L Mux' ADC0L"
		cset "name='ADIF1 R Mux' ADC0R"
		cset "name='Adif1 Input Volume' 96,96"
		cset "name='Adif1 Input Switch' on,on"
		cset "name='Ext TX L Mixer ADIF1 Switch' on"
		cset "name='Ext TX R Mixer ADIF1 Switch' on"
	]
	DisableSequence [
		cset "name='Ext TX L Mixer ADIF1 Switch' off"
		cset "name='Ext TX R Mixer ADIF1 Switch' off"
		cset "name='ADC0 L Mixer MIC2 Switch' off"
		cset "name='ADC0 R Mixer MIC2 Switch' off"
		cset "name='Mic2 Capture Switch' off"
	]

	Value {
		CapturePriority 100
		CaptureMixer "hw:${CardId}"
		CaptureMixerElem "Mic2"
		CaptureVolume "Mic2 Capture Volume"
		CaptureSwitch "Mic2 Capture Switch"
	}
}
